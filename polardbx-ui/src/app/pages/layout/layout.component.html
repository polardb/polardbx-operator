<nz-layout class="app-layout">
  <nz-sider class="menu-sider" 
            nzCollapsible 
            [(nzCollapsed)]="isCollapsed" 
            [nzTrigger]="null"
            nzWidth="256px" 
            [nzCollapsedWidth]="80"
            nzTheme="light">
    <div class="logo">
      <span class="logo-full">PolarDB-X</span>
      <span class="logo-mini">PD-X</span>
    </div>
    <ul nz-menu 
        nzMode="inline" 
        nzTheme="light" 
        [nzInlineCollapsed]="isCollapsed"
        class="sider-menu">
      <li nz-menu-item 
          routerLink="/clusters" 
          nzMatchRouter>
        <nz-icon nzType="appstore"></nz-icon>
        <span>集群管理</span>
      </li>
      
      <li nz-submenu nzTitle="备份管理" nzIcon="cloud-upload">
        <ul>
          <li nz-menu-item routerLink="/backup/overview" nzMatchRouter>
            <nz-icon nzType="pie-chart"></nz-icon>
            <span>备份概览</span>
          </li>
          <li nz-menu-item routerLink="/backup/manual-backups" nzMatchRouter>
            <nz-icon nzType="save"></nz-icon>
            <span>全量备份</span>
          </li>
          <li nz-menu-item routerLink="/backup/backup-schedules" nzMatchRouter>
            <nz-icon nzType="calendar"></nz-icon>
            <span>定时备份</span>
          </li>
          <li nz-menu-item routerLink="/backup/backup-binlogs" nzMatchRouter>
            <nz-icon nzType="file-done"></nz-icon>
            <span>增量日志备份</span>
          </li>
          <li nz-menu-item routerLink="/backup/xstore-backups" nzMatchRouter>
            <nz-icon nzType="inbox"></nz-icon>
            <span>存储备份</span>
          </li>
        </ul>
      </li>
      
      <li nz-submenu nzTitle="恢复管理" nzIcon="undo">
        <ul>
          <li nz-menu-item routerLink="/recovery/restore-wizard" nzMatchRouter>
            <nz-icon nzType="build"></nz-icon>
            <span>恢复向导</span>
          </li>
          <li nz-menu-item routerLink="/recovery/restore-jobs" nzMatchRouter>
            <nz-icon nzType="history"></nz-icon>
            <span>恢复任务</span>
          </li>
        </ul>
      </li>
      
      <li nz-submenu nzTitle="存储管理" nzIcon="database">
        <ul>
          <li nz-menu-item routerLink="/storage/xstores" nzMatchRouter>
            <nz-icon nzType="cluster"></nz-icon>
            <span>存储节点</span>
          </li>
          <li nz-submenu nzTitle="备库重搭" nzIcon="deployment-unit">
            <ul>
              <li nz-menu-item routerLink="/storage/xstore-rebuild/rebuild/tasks" nzMatchRouter>
                <nz-icon nzType="bars"></nz-icon>
                <span>重搭任务</span>
              </li>
              <li nz-menu-item routerLink="/storage/xstore-rebuild/rebuild/new" nzMatchRouter>
                <nz-icon nzType="plus"></nz-icon>
                <span>创建重搭任务</span>
              </li>
              <li nz-menu-item routerLink="/storage/xstore-rebuild/health-check" nzMatchRouter>
                <nz-icon nzType="check-circle"></nz-icon>
                <span>健康检查</span>
              </li>
              <li nz-menu-item routerLink="/storage/xstore-followers" nzMatchRouter>
                <nz-icon nzType="team"></nz-icon>
                <span>Follower 管理</span>
              </li>
            </ul>
          </li>
        </ul>
      </li>
      
      <!-- 移除单独的“监控与告警”一级模块，合并到运维管理下 -->
      
      <li nz-submenu nzTitle="运维管理" nzIcon="setting">
        <ul>
          <li nz-menu-item routerLink="/operations/monitoring/enable-wizard" nzMatchRouter>
            <nz-icon nzType="dashboard"></nz-icon>
            <span>监控安装向导</span>
          </li>
          <li nz-menu-item routerLink="/operations/logs/install" nzMatchRouter>
            <nz-icon nzType="container"></nz-icon>
            <span>日志采集安装向导</span>
          </li>
 
          <li nz-submenu nzTitle="参数与调优" nzIcon="sliders">
            <ul>
              <li nz-menu-item routerLink="/operations/parameter-templates" nzMatchRouter>
                <nz-icon nzType="control"></nz-icon>
                <span>参数模板</span>
              </li>
              <li nz-menu-item routerLink="/operations/cluster-knobs" nzMatchRouter>
                <nz-icon nzType="api"></nz-icon>
                <span>集群调优（todo）</span>
              </li>
            </ul>
          </li>

          <li nz-submenu nzTitle="运维助手" nzIcon="tool">
            <ul>
              <li nz-menu-item routerLink="/operations/diagnostics" nzMatchRouter>
                <nz-icon nzType="file-search"></nz-icon>
                <span>诊断与排障</span>
              </li>
              <li nz-menu-item routerLink="/operations/runbook-slo" nzMatchRouter>
                <nz-icon nzType="book"></nz-icon>
                <span>Runbook / SLO</span>
              </li>
            </ul>
          </li>

          <li nz-menu-item routerLink="/operations/settings" nzMatchRouter>
            <nz-icon nzType="control"></nz-icon>
            <span>阈值与设置</span>
          </li>
        </ul>
      </li>
    </ul>
  </nz-sider>
  
  <nz-layout class="site-layout" [style.margin-left.px]="isCollapsed ? 80 : 256">
    <nz-header class="app-header">
      <nz-icon class="trigger" 
               [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'" 
               (click)="isCollapsed = !isCollapsed">
      </nz-icon>
      <span class="header-title">可视化运维平台</span>
      <span class="spacer"></span>
      <div class="header-actions">
        <!-- 未认证状态：显示登录按钮 -->
        <ng-container *ngIf="!isAuthenticated">
          <button nz-button nzType="default" nzShape="round" (click)="openLogin()" class="login-btn">
            <i nz-icon nzType="login"></i>
            <span>登录</span>
          </button>
        </ng-container>
        
        <!-- 已认证状态：显示用户操作按钮 -->
        <ng-container *ngIf="isAuthenticated">
          <button nz-button nzType="default" nzShape="round" (click)="reconnect()" class="reconnect-btn" nzGhost>
            <i nz-icon nzType="reload"></i>
            <span>重新连接</span>
          </button>
          <button nz-button nzType="primary" nzShape="round" (click)="logout()" class="logout-btn" nzDanger>
            <i nz-icon nzType="logout"></i>
            <span>登出</span>
          </button>
        </ng-container>
        
        <nz-divider nzType="vertical"></nz-divider>
        <div class="ns-select">
          <span class="label">命名空间</span>
          <nz-select [ngModel]="activeNamespace || 'polardbx-operator-system'" (ngModelChange)="onChangeNamespace($event)" nzSize="default" [nzDropdownMatchSelectWidth]="false" style="min-width: 180px;">
            <nz-option *ngFor="let n of namespaces" [nzValue]="n" [nzLabel]="n"></nz-option>
          </nz-select>
        </div>
      </div>
    </nz-header>
    
    <nz-content class="inner-content">
      <router-outlet></router-outlet>
    </nz-content>
  </nz-layout>
</nz-layout>
