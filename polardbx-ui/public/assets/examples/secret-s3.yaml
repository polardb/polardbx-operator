apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-credentials
  namespace: default
type: Opaque
stringData:
  accessKey: YOUR_AWS_ACCESS_KEY_ID
  secretKey: YOUR_AWS_SECRET_ACCESS_KEY
  region: us-east-1
  endpoint: https://s3.amazonaws.com
  # 可选: roleArn: arn:aws:iam::123456789012:role/YourBackupRole
