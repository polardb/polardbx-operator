{{- if .Values.backend.enabled }}
{{- $sa := .Values.serviceAccount | default dict -}}
{{- if (get $sa "create") | default false }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "polardbx.dashboard.backend.serviceAccountName" . }}
  labels:
    {{- include "polardbx.dashboard.backend.labels" . | nindent 4 }}
{{- end }}
{{- end }}


