apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polardbx.dashboard.backend.fullname" . }}-secret
  labels:
    {{- include "polardbx.dashboard.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.backend.secrets.kubeconfig }}
  kubeconfig: {{ .Values.backend.secrets.kubeconfig | quote }}
  {{- end }}
  {{- if .Values.backend.secrets.hpfsAccessKey }}
  HPFS_ACCESS_KEY: {{ .Values.backend.secrets.hpfsAccessKey | quote }}
  {{- end }}
  {{- if .Values.backend.secrets.hpfsSecretKey }}
  HPFS_SECRET_KEY: {{ .Values.backend.secrets.hpfsSecretKey | quote }}
  {{- end }}

